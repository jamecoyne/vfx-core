[package]
name = "colour-adjust"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Brightness, contrast and saturation, rendered on the GPU."

# The plugin's identity in every host. Hosts find a plugin in saved projects by its IDs
# (id, ae-match-name, ffgl-code): choose them once and keep them across versions.
[package.metadata.vfx]
name = "Colour Adjust"                  # in each host's effect list (FFGL: 16 bytes at most)
category = "vfx-core"                 # After Effects category and OpenFX grouping
file = "ColourAdjust"                   # bundles, DLLs, installers and logs (no spaces)
id = "com.vfx-core.ColourAdjust"        # OpenFX identifier; macOS bundle IDs start with it
ae-match-name = "VFXColourAdjust"
ffgl-code = "VCOL"                    # exactly 4 characters
windows-installer-id = "5CDE4702-3D71-4EF6-AAD3-4F28AC19C6D8"

# The host targets. `cargo vfx build` switches them on and bundles the one binary for each.
[features]
ae = ["vfx-plugin/ae"]
ofx = ["vfx-plugin/ofx"]
ffgl = ["vfx-plugin/ffgl"]

# The rlib is the effect (for the preview app, tests and tools); the cdylib is the plugin.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vfx-core = { path = "../../vfx-core" }
vfx-plugin = { path = "../../vfx-core/wrappers/plugin" }

[build-dependencies]
vfx-build = { path = "../../vfx-core/wrappers/build" }
