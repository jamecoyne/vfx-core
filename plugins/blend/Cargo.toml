[package]
name = "blend"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Blends a second layer over the input: normal, add, multiply or screen, on the GPU."

# The plugin's identity in every host. Hosts find a plugin in saved projects by its IDs
# (id, ae-match-name, ffgl-code): choose them once and keep them across versions.
[package.metadata.vfx]
name = "Blend"                  # in each host's effect list (FFGL: 16 bytes at most)
category = "vfx-core"                 # After Effects category and OpenFX grouping
file = "Blend"                   # bundles, DLLs, installers and logs (no spaces)
id = "com.vfx-core.Blend"        # OpenFX identifier; macOS bundle IDs start with it
ae-match-name = "VFXBlend"
ffgl-code = "VBLN"                    # exactly 4 characters
windows-installer-id = "F533E0C4-B11B-4948-8245-77371F0196B5"

# The host targets. `cargo vfx build` switches them on and bundles the one binary for each.
[features]
ae = ["vfx-plugin/ae"]
ofx = ["vfx-plugin/ofx"]
ffgl = ["vfx-plugin/ffgl"]

# The rlib is the effect (for the preview app, tests and tools); the cdylib is the plugin.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vfx-core = { path = "../../vfx-core" }
vfx-plugin = { path = "../../vfx-core/wrappers/plugin" }

[build-dependencies]
vfx-build = { path = "../../vfx-core/wrappers/build" }
