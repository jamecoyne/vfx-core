[package]
name = "swarm-pass-web-trial"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Draws segcam's swarm with render passes on WebGL2 and compares it with the CPU."

# A trial page, kept out of the repo's workspace so it changes no shared file.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
segcam-motion = { path = ".." }
wgpu = { version = "=30.0.1", features = ["fragile-send-sync-non-atomic-wasm", "webgl"] }
# The installed wasm-bindgen-cli must be this version.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d", "Document", "Element", "HtmlCanvasElement", "ImageData",
    "RequestInit", "Response", "Window",
] }
web-time = "1.1.0"
console_error_panic_hook = "0.1"
