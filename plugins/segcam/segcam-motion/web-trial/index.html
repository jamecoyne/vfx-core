<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>segcam swarm pass on WebGL2</title>
<style>
  body { font: 13px/1.4 monospace; margin: 16px; }
  canvas { width: 960px; height: 540px; background: #777; display: block; margin: 12px 0; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="picture"></canvas>
<pre id="report">loading</pre>
<script type="module">
  import init from "./swarm_pass_web_trial.js";
  init().catch((e) => {
    document.getElementById("report").textContent += "\nfailed: " + e;
    fetch("report", { method: "POST", body: "failed: " + e });
  });
</script>
</body>
</html>
