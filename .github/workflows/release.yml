name: release

# Builds the plugins on GitHub's macOS, Windows and Linux runners. Pushing a version tag
# puts the files on a draft release to check and publish: v1.2.3 builds every effect,
# segcam-v1.2.3 builds segcam alone. Running it by hand (Actions → release → Run workflow)
# leaves the files as the run's artifacts, for the effects named in its `crates` box.
on:
  push:
    tags: ["v*", "segcam-v*"]
  workflow_dispatch:
    inputs:
      crates:
        description: Effect crates to build, space separated (empty builds every effect)
        default: ""

permissions:
  contents: write

env:
  # The tag (or `dev`), and the crates to build (empty: every effect crate). Each job's
  # `crates and version` step turns them into CRATES and VERSION (1.2.3, no prefix).
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
  CRATES: >-
    ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'segcam-v') && 'segcam-motion' || inputs.crates || '' }}

jobs:
  macos:
    runs-on: macos-latest
    env:
      # Signing and notarization run only when these secrets are set (README: Releases).
      MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
      MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # `cargo vfx package` signs when SIGN_IDENTITY and INSTALLER_IDENTITY are set and
      # notarizes when NOTARY_PROFILE is; this puts the certificates in a keychain for it.
      - name: Signing keychain
        if: env.MACOS_CERTIFICATES_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild
          rm "$RUNNER_TEMP/certificates.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"
          identity() { security find-identity -v "$keychain" | grep -o "\"$1: [^\"]*\"" | head -1 | tr -d '"'; }
          echo "SIGN_IDENTITY=$(identity 'Developer ID Application')" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$(identity 'Developer ID Installer')" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials vfx-notary --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "NOTARY_PROFILE=vfx-notary" >> "$GITHUB_ENV"
          fi

      - name: Crates and version
        run: ./.github/release-env.sh

      # Each effect crate: an After Effects and an OpenFX installer, and Resolume's bundle.
      - name: Build the installers
        run: |
          cargo vfx package $(printf -- '-p %s ' $CRATES)
          mkdir -p dist
          for crate in $CRATES; do
            eval "$(cargo vfx env -p "$crate")"
            name="$PLUGIN_FILE-$VERSION-macOS"
            cp "target/vfx-plugin/$PLUGIN_FILE-adobe.pkg" "dist/$name-AfterEffects.pkg"
            cp "target/vfx-plugin/$PLUGIN_FILE-ofx.pkg" "dist/$name-OpenFX.pkg"
            ditto -c -k --keepParent "target/vfx-plugin/$PLUGIN_FILE.bundle" "dist/$name-Resolume.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-macOS
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Crates and version
        shell: bash
        run: ./.github/release-env.sh

      - name: Build each effect's plugins, installer and zip
        shell: bash
        run: |
          for crate in $CRATES; do
            EFFECT="$crate" ./vfx-core/wrappers/package-win.sh
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-Windows
          path: |
            target/vfx-plugin/*-Windows-Setup.exe
            target/vfx-plugin/*-Windows.zip
          if-no-files-found: error

  # OpenFX plugins for Linux hosts (Resolve, Nuke, Natron), built on AlmaLinux 8 so they
  # load on glibc 2.28 and newer (the VFX Reference Platform's Rocky and Alma Linux 8 and 9).
  # segcam's frames are checked against its CLI with the bundled binary itself.
  linux:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # ONNX Runtime's build script downloads its library over native TLS.
      - name: OpenSSL headers
        run: dnf install -y openssl-devel

      - name: Crates and version
        run: ./.github/release-env.sh

      - name: Build each effect's OpenFX bundle
        run: |
          mkdir -p dist
          for crate in $CRATES; do
            cargo vfx build -p "$crate" --hosts ofx
            eval "$(cargo vfx env -p "$crate")"
            so="target/vfx-plugin/$PLUGIN_FILE.ofx.bundle/Contents/Linux-x86-64/$PLUGIN_FILE.ofx"
            echo "$so needs: $(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
            tar -C target/vfx-plugin -czf "dist/$PLUGIN_FILE-$VERSION-Linux-OpenFX.tar.gz" "$PLUGIN_FILE.ofx.bundle"
          done

      - name: segcam in the OpenFX mini host, against its CLI
        if: contains(env.CRATES, 'segcam-motion')
        run: |
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/openfx.git "$RUNNER_TEMP/openfx"
          export PATH="/opt/python/cp312-cp312/bin:$PATH"
          OFX_INCLUDE="$RUNNER_TEMP/openfx/include" SEGCAM_TEST_DIR="$RUNNER_TEMP/segcam-ofx" \
            PLUGIN="$PWD/target/vfx-plugin/SegcamMotionRust.ofx.bundle/Contents/Linux-x86-64/SegcamMotionRust.ofx" \
            ./plugins/segcam/segcam-motion/ofx-tests/run.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-Linux
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --title "$GITHUB_REF_NAME" --generate-notes
