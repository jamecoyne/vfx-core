name: release

# Builds every plugin on GitHub's macOS and Windows runners. Pushing a version tag
# (v1.2.3) puts the files on a draft release to check and publish; running it by hand
# (Actions → release → Run workflow) leaves them as the run's artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  macos:
    runs-on: macos-latest
    env:
      # Signing and notarization run only when these secrets are set (README: Releases).
      MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
      MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # A run by hand reuses main's built dependencies; a tag builds clean.
      - uses: Swatinem/rust-cache@v2
        if: github.ref_type != 'tag'
        with:
          shared-key: plugins
          save-if: false

      # `cargo vfx package` signs when SIGN_IDENTITY and INSTALLER_IDENTITY are set and
      # notarizes when NOTARY_PROFILE is; this puts the certificates in a keychain for it.
      - name: Signing keychain
        if: env.MACOS_CERTIFICATES_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/certificates.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"
          identity() { security find-identity -v "$keychain" | grep -o "\"$1: [^\"]*\"" | head -1 | tr -d '"'; }
          echo "SIGN_IDENTITY=$(identity 'Developer ID Application')" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$(identity 'Developer ID Installer')" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials vfx-notary --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "NOTARY_PROFILE=vfx-notary" >> "$GITHUB_ENV"
          fi

      # One installer with every effect for After Effects and OpenFX, and segcam's zips.
      - name: Build the installer and zips
        run: |
          VERSION="${VERSION#v}" ./vfx-core/wrappers/package-mac.sh
          mkdir -p dist
          cp target/vfx-plugin/*-macOS.pkg target/vfx-plugin/*-macOS-*.zip dist/

      - uses: actions/upload-artifact@v7
        with:
          name: release-macOS
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        if: github.ref_type != 'tag'
        with:
          shared-key: plugins
          save-if: false

      # Inno Setup 7.1.1 from its own release, checked against the hash in its signed .issig.
      # Chocolatey has no 7.x and the runner image has 6.7.1, so package-win.sh gets this
      # compiler through ISCC. Portable mode leaves no uninstaller or registry entries.
      - name: Install Inno Setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download is-7_1_1 --repo jrsoftware/issrc --pattern innosetup-7.1.1-x64.exe --dir $env:RUNNER_TEMP
          $setup = Join-Path $env:RUNNER_TEMP innosetup-7.1.1-x64.exe
          $sha256 = '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0'
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $sha256) { throw "$setup does not match its sha256" }
          $dir = Join-Path $env:RUNNER_TEMP inno-setup
          $install = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/PORTABLE=1', '/CURRENTUSER', "/DIR=$dir"
          if ($install.ExitCode -ne 0) { throw "Inno Setup's installer exited with $($install.ExitCode)" }
          "ISCC=$($dir -replace '\\', '/')/ISCC.exe" >> $env:GITHUB_ENV

      # One installer with every effect for every host, and segcam's zips.
      - name: Build the installer and zips
        shell: bash
        run: VERSION="${VERSION#v}" ./vfx-core/wrappers/package-win.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-Windows
          path: |
            target/vfx-plugin/*-Windows-Setup.exe
            target/vfx-plugin/*-Windows-*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --title "$GITHUB_REF_NAME"
