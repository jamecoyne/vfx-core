name: pages

# Builds the preview app for the browser (WebGPU) and publishes it with GitHub Pages.
# Needs Pages enabled with "GitHub Actions" as the source (Settings → Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # wasm-bindgen's CLI must match the wasm-bindgen crate in Cargo.lock exactly.
      - name: Find the wasm-bindgen version
        id: wasm-bindgen
        run: |
          v=$(cargo metadata --format-version 1 --locked \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "wasm-bindgen"))')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Build the web preview
        run: ./vfx-core/examples/preview/web/build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
