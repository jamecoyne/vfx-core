name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      WGPU_BACKEND: ${{ matrix.os == 'ubuntu-latest' && 'vulkan' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install software Vulkan (lavapipe) for headless rendering
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - name: Format
        run: cargo fmt --all -- --check

      # The core, the host-neutral crates and the effect crates (as libraries): plain Rust
      # and wgpu, so they build and test on every OS.
      - name: Clippy
        run: cargo clippy -p vfx-core -p vfx-host -p vfx-build -p vfx-chain -p segcam-motion -p segcam-face -p cargo-vfx --all-targets -- -D warnings

      - name: Tests (headless render, effects, reference checks)
        run: cargo test -p vfx-core -p vfx-host -p vfx-build -p vfx-chain -p segcam-motion -p segcam-face -p cargo-vfx

      # segcam-face without ONNX Runtime: Vision alone on macOS, no detector elsewhere.
      - name: segcam-face without ONNX Runtime
        run: |
          cargo clippy -p segcam-face --no-default-features --all-targets -- -D warnings
          cargo test -p segcam-face --no-default-features

      # Every effect's identity is unique and the preview offers every effect.
      - name: cargo vfx check
        run: cargo vfx check

  # Every effect as a plugin for every host: After Effects (.plugin / .aex), OpenFX and
  # FFGL, each built by `cargo vfx` from one binary per effect. Unsigned; signing needs
  # the publisher's certificates.
  plugins:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
          components: clippy

      - name: Host target tests and clippy (every host feature on)
        run: |
          cargo test -p vfx-ae -p vfx-ofx -p vfx-ffgl -p vfx-ffgl-common
          cargo clippy -p vfx-ae -p vfx-ofx -p vfx-ffgl -p vfx-ffgl-common -p vfx-plugin -p vfx-chain -p segcam-motion --features vfx-chain/ae,vfx-chain/ofx,vfx-chain/ffgl,segcam-motion/ae,segcam-motion/ofx,segcam-motion/ffgl --all-targets -- -D warnings

      # Each effect in the minimal OpenFX host, built on the official OpenFX headers:
      # VFX Preview's checks, and segcam's frames against its CLI.
      - name: OpenFX mini hosts
        shell: bash
        run: |
          git clone --depth 1 https://github.com/AcademySoftwareFoundation/openfx.git "$RUNNER_TEMP/openfx"
          export OFX_INCLUDE="$RUNNER_TEMP/openfx/include"
          [ "$RUNNER_OS" = Windows ] && export CC=clang
          ./vfx-core/wrappers/ofx/minihost/run.sh
          SEGCAM_TEST_DIR="$RUNNER_TEMP/segcam-ofx" ./plugins/segcam/segcam-motion/ofx-tests/run.sh

      # FFGL needs an OpenGL context: macOS runners provide Apple's software renderer.
      # The Windows FFGL mini host runs locally only; runners have no OpenGL 4.1 GPU.
      - name: FFGL mini hosts (macOS)
        if: runner.os == 'macOS'
        env:
          FFGL_MINIHOST_SOFTWARE: 1
        run: |
          ./vfx-core/wrappers/ffgl/minihost/run.sh
          ./plugins/segcam/segcam-motion/ffgl-tests/run.sh

      - name: Build every plugin
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            cargo vfx package
          else
            cargo vfx build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vfx-plugins-${{ runner.os }}
          path: |
            target/vfx-plugin/*.pkg
            target/vfx-plugin/*.plugin
            target/vfx-plugin/*.aex
            target/vfx-plugin/*.ofx.bundle
            target/vfx-plugin/*.dll
            target/vfx-plugin/*.bundle
          if-no-files-found: error
