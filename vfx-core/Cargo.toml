[package]
name = "vfx-core"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
thiserror = "2.0.21"
wgpu = "=30.0.2"

# Browsers are single-threaded: lets wgpu's web types satisfy the `Send` bound on effects,
# so any web build of the core compiles, not just the preview's. Safe without wasm threads
# (atomics), which no build here uses.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "=30.0.2", features = ["fragile-send-sync-non-atomic-wasm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"

# The versions wgpu-hal uses: `device::luid` reads an adapter's LUID through them.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
ash = "0.38.0"

[target.'cfg(windows)'.dependencies]
libloading = "0.9.0"
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
] }

[features]
# wgpu's WebGL2 backend, for browsers: off by default, so native builds and the WebGPU web
# build are unchanged.
webgl = ["wgpu/webgl"]

[target.'cfg(windows)'.dev-dependencies]
# wgpu-hal's version: the device removal test casts its D3D12 device.
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D12"] }

[dev-dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
tempfile = "3.27.0"
