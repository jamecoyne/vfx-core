[package]
name = "vfx-preview"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false

# `tracker`: the "Detect faces" box on Windows and Linux, through segcam-face's YuNet. Without it,
# the face variables come only from effects that report them.
[features]
default = ["tracker"]
tracker = ["dep:segcam-face"]

[dependencies]
vfx-core = { path = "../.." }
vfx-host = { path = "../../wrappers/common" }
# The repository's effect crates, which the preview offers alongside the core effects. Its
# build script lists every path dependency with [package.metadata.vfx]; `cargo vfx new` adds
# a new effect here, and `cargo vfx check` reports one that's missing.
vfx-chain = { path = "../../../plugins/vfx-chain" }
colour-adjust = { path = "../../../plugins/colour-adjust" }
gaussian-blur = { path = "../../../plugins/gaussian-blur" }
vignette = { path = "../../../plugins/vignette" }
blend = { path = "../../../plugins/blend" }
segcam-motion = { path = "../../../plugins/segcam/segcam-motion" }
wgpu = "=30.0.2"
# egui's winit backend targets winit 0.30.
winit = "0.30.13"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false }
bytemuck = "1.25.2"
# std::time::Instant panics in browsers; web-time is the same type on native.
web-time = "1.1.0"

[build-dependencies]
vfx-build = { path = "../../wrappers/build" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "links"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pollster = "1.0.1"
# Native file picker for "Import…".
rfd = "0.18.0"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Runs the face model (models/face_detection_yunet_2023mar.onnx); segcam-face has no ONNX Runtime
# on macOS.
ort = "=2.0.0-rc.15"

[target.'cfg(not(any(target_os = "macos", target_arch = "wasm32")))'.dependencies]
segcam-face = { path = "../../../plugins/segcam/segcam-face", optional = true }

[target.'cfg(windows)'.dependencies]
# A job object, so ffmpeg and ffplay close with the app.
windows-sys = { version = "0.61.2", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
# wgpu's own version. `--lose-gpu SECONDS:removed` casts its D3D12 device, and Spout input
# (spout.rs) opens senders' textures with D3D11 and shares them with wgpu's device.
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Security", "Win32_System_Memory", "Win32_System_Threading",
] }

# The web build (GitHub Pages): WebGPU in the browser, started from JavaScript.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browsers are single-threaded: lets wgpu's WebGPU types satisfy vfx-core's `Send`
# bound on effects. Safe without wasm threads (atomics), which this build doesn't use.
wgpu = { version = "=30.0.2", features = ["fragile-send-sync-non-atomic-wasm", "webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# The DOM, plus a <video> for video files and the webcam (web_media.rs).
web-sys = { version = "0.3", features = [
    "DataTransfer", "Document", "DragEvent", "Element", "HtmlElement", "Location", "Window",
    "HtmlInputElement", "HtmlMediaElement", "HtmlVideoElement", "File", "FileList", "Blob", "Url",
    "Navigator", "MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints",
    "CanvasRenderingContext2d",
    "BlobEvent", "BlobPropertyBag", "HtmlAnchorElement", "HtmlCanvasElement", "MediaRecorder",
    "MediaRecorderOptions", "RecordingState", "console",
] }
console_error_panic_hook = "0.1"
