[package]
name = "vfx-chain"
version = "1.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Colour adjust, vignette, layer blend and Gaussian blur, rendered on the GPU."

# The plugin's identity in every host. Hosts find a plugin in saved projects by its IDs
# (id, ae-match-name, ffgl-code): choose them once and keep them across versions.
[package.metadata.vfx]
name = "VFX Preview"                  # in each host's effect list (FFGL: 16 bytes at most)
category = "vfx-core"                 # After Effects category and OpenFX grouping
file = "VfxPreview"                   # bundles, DLLs, installers and logs (no spaces)
id = "com.vfx-core.VfxPreview"        # OpenFX identifier; macOS bundle IDs start with it
ae-match-name = "VFXPreview"
ffgl-code = "VFXP"                    # exactly 4 characters
windows-installer-id = "2FFBD5EA-ABD9-4A8F-9ACC-24CF0C2C2E3E"

# The host targets. `cargo vfx build` switches them on and bundles the one binary for each.
[features]
ae = ["vfx-plugin/ae"]
ofx = ["vfx-plugin/ofx"]
ffgl = ["vfx-plugin/ffgl"]

# The rlib is the effect (for the preview app, tests and tools); the cdylib is the plugin.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vfx-core = { path = "../.." }
vfx-plugin = { path = "../../wrappers/plugin" }

[build-dependencies]
vfx-build = { path = "../../wrappers/build" }

[dev-dependencies]
pollster = "1.0.1"
# The After Effects harness's reference renderer (examples/ae_reference.rs).
vfx-host = { path = "../../wrappers/common" }
