[package]
name = "vfx-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "What every vfx-core host target shares: the registered plugin, the GPU, the render pool and the render-path log."

[dependencies]
vfx-core = { path = "../.." }
bytemuck = "1.25.2"
pollster = "1.0.1"

# Browsers can't start threads: frame work runs on the calling thread there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12.0"
