[package]
name = "vfx-host"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false
description = "What every vfx-core host target shares: the registered plugin, the GPU, the render pool and the render-path log."

[dependencies]
vfx-core = { path = "../.." }
bytemuck = "1.25.2"
pollster = "1.0.1"
thiserror = "2.0.21"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D12"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# Browsers can't start threads: frame work runs on the calling thread there.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12.0"
