# One workspace for two folders: vfx-core/, the toolchain (the core crate, the host targets,
# cargo vfx, the preview and the VFX Preview demo effect), and plugins/, effects built with it.
# Nothing in vfx-core/ depends on plugins/ except the preview's list of effects.
[workspace]
resolver = "3"
members = ["vfx-core", "vfx-core/effects/vfx-chain", "vfx-core/examples/preview", "vfx-core/wrappers/common", "vfx-core/wrappers/build", "vfx-core/wrappers/plugin", "vfx-core/tools/cargo-vfx", "vfx-core/wrappers/adobe", "vfx-core/wrappers/ofx", "vfx-core/wrappers/ffgl", "vfx-core/wrappers/ffgl-common", "plugins/segcam/segcam-motion", "plugins/segcam/segcam-face"]
# Plain `cargo test` builds only the core, so windowing never enters CI on Linux.
default-members = ["vfx-core"]

# The pixel heavy crates' tests run optimised: minutes become seconds, and overflow checks and
# debug assertions stay on.
[profile.test.package.segcam-motion]
opt-level = 2

[profile.test.package.vfx-core]
opt-level = 2
